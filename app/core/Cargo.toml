[package]
name = "highlighter-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "highlighter_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
nostr-sdk = { version = "0.44.1", features = ["nip49", "nip04", "nip44"] }
nostr = { version = "0.44", default-features = false, features = ["std", "nip46"] }
nostr-ndb = "0.44.0"
nostrdb = { git = "https://github.com/pablof7z/nostrdb-rs", rev = "2619b9bc4cbd7d8d9198a3be0ae8f1f8f51040cb" }
nmp-feedback = { git = "https://github.com/pablof7z/nmp-feedback.git", rev = "fc0589fc88d61912779741fcce7d4e7176cf9a30", default-features = false }
# NMP tracks the master branch via GIT deps (NOT local path deps) so hl is
# decoupled from the local monorepo checkout. `cargo update` refreshes Cargo.lock
# to the current master tip; a rebuild then picks up the latest NMP automatically.
nmp-core = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-ffi = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f", features = ["signer-broker", "external-signer"] }
nmp-defaults = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-signers = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-nip11 = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-nip02 = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-nip25 = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-nip29 = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-nip51 = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-nip78 = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-blossom = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-content = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
nmp-kinds = { git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "b4404159d0d87325f8c65574f7ba46981fc0098f" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
sha2 = "0.10"
base64 = "0.22"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = { version = "0.29", features = ["cli", "tokio"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
url = "2"
scraper = "0.20"
regex = "1"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[patch.crates-io]
nostrdb = { git = "https://github.com/pablof7z/nostrdb-rs", rev = "2619b9bc4cbd7d8d9198a3be0ae8f1f8f51040cb" }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3"

# Pre-existing codebase uses sort_by with closures throughout; suppress at
# crate level rather than touching every pre-existing call site.
[lints.clippy]
unnecessary_sort_by = "allow"
# Phase 3G: `actor_task` seeds AppState with `Default::default()` then
# immediately overwrites `room_policy` from the injected `KernelPolicy`.
# Restructuring would change actor_task's signature; allow the pre-existing
# pattern crate-wide rather than touching every field initialisation site.
field_reassign_with_default = "allow"
