name: Android

on:
  push:
    branches: [main]
    paths:
      - "app/android/**"
      - "app/core/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/android/**"
      - "app/core/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # app/core has path dependencies on ../../../nostr-multi-platform, so the
      # two repos must be checked out as siblings. If nostr-multi-platform is
      # private, add an NMP_CHECKOUT_TOKEN repo secret (a PAT with read access).
      - uses: actions/checkout@v4
        with:
          path: hl

      - uses: actions/checkout@v4
        with:
          repository: pablof7z/nostr-multi-platform
          path: nostr-multi-platform
          token: ${{ secrets.NMP_CHECKOUT_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hl/app/core

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: hl/app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        working-directory: hl/app/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Android Lint
        working-directory: hl/app/android
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: highlighter-debug-apk
          path: hl/app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: hl/app/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
